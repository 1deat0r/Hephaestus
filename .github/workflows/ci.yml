# Environment-independent gates. Single gate registry: the Makefile (`make ci`).
# hooks-check self-skips under CI (GitHub Actions sets CI=true).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned (master @ 2026-09-30; ADR-024 — mutable refs are gate rot).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-validation.txt
      # Sandbox tests hard-require bwrap (honest green — they never skip).
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Run environment-independent gates
        run: make ci

  # rustdoc warnings denied, parallel to gates (ADR-024 sequence step 10).
  # Deliberately NOT part of `make ci` — local latency budget stays untouched.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same SHA pin as `gates` (ADR-024 — mutable refs are gate rot).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
      # Registry single-sourcing: this job's command is defined once, in
      # `make doc-check` (ADR-025); doc-check itself is in no tier.
      - name: cargo doc with warnings denied
        run: make doc-check
