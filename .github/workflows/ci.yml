# Dormant until a remote exists (Q7a). Environment-independent gates only.
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run environment-independent gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          PYTHONPATH=python python -m unittest discover -s python/tests -t python -v
          python tools/verify_package.py
          python -m unittest discover -s tests
