# Environment-independent gates. Single gate registry: the Makefile (`make ci`).
# hooks-check self-skips under CI (GitHub Actions sets CI=true).
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-validation.txt
      - name: Run environment-independent gates
        run: make ci
