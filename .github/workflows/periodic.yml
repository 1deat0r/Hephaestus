# Scheduled freshness audits (ADR-024, tier T3). Not triggered by pushes —
# push CI stays fast; failures here notify the owner via GitHub alerts.
# NOTE: GitHub auto-disables scheduled workflows after ~60 days without
# repository activity; the watchdog below cannot run if the workflow is
# disabled, so this note is part of the operational contract.
name: periodic

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (off-the-hour to dodge fleet collisions)
  workflow_dispatch:

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: External link audit (online, stdlib only)
        run: python tools/check_links_online.py
      - name: Audit-artifact cadence watchdog
        run: python tools/check_audit_age.py
      # Ticket Verify commands may be cargo tests (ADR-028).
      - name: Rust toolchain for ticket Verify commands (ADR-028)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Install bubblewrap (sandbox Verify commands, ADR-028)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Ticket status sweep — stale labels fail (ADR-028)
        run: python tools/check_ticket_status.py --sweep
