# Scheduled freshness audits (ADR-024, tier T3). Not triggered by pushes —
# push CI stays fast; failures here notify the owner via GitHub alerts.
# NOTE: GitHub auto-disables scheduled workflows after ~60 days without
# repository activity; the watchdog below cannot run if the workflow is
# disabled, so this note is part of the operational contract.
name: periodic

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (off-the-hour to dodge fleet collisions)
  workflow_dispatch:

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: External link audit (online, stdlib only)
        run: python tools/check_links_online.py
      - name: Audit-artifact cadence watchdog
        run: python tools/check_audit_age.py
